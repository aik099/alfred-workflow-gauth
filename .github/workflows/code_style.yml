name: Docs

on:
  push:
    paths: ['src/**', '.github/workflows/code_style.yml.yml']
  pull_request:
    paths: ['src/**', '.github/workflows/code_style.yml.yml']

defaults:
  run:
    shell: bash

jobs:

  tests:
    name: Code Style
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Python
        uses: actions/setup-python@v5

      - name: Install dependencies
        run: |
            pip install pep8

      - name: Run tests
        run: |
          pep8 src/*.py
